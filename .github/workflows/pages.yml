# Publication du jeu sur GitHub Pages.
#
# Le jeu reste 100 % statique, mais la publication est précédée de la même
# suite de vérification que localement. L'artefact ne contient ensuite que les
# fichiers publics nécessaires au runtime.
#
# ⚠️ `npm run stamp` EST OBLIGATOIRE avant publication. Le service worker ouvre
# son cache sous un nom constant et l'activation ne purge que les anciennes
# versions YOLE : publier sans ré-estampiller laisserait chaque joueur déjà venu
# sur l'ANCIENNE version, sans que rien ne le signale.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier l'autorisation de publication
        run: python tools/release.py --check-readiness

      - name: Tester la politique de release
        run: npm run test:release

      - name: Installer les dépendances de validation
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Exécuter la suite complète
        run: npm test

      - name: Préparer uniquement les fichiers publics
        run: |
          mkdir -p _site
          cp index.html style.css legal.css privacy.html support.html credits.html manifest.webmanifest service-worker.js _site/
          cp -R src vendor assets icons zik _site/
          touch _site/.nojekyll

      - name: Re-vérifier l'autorisation avant téléversement
        run: python tools/release.py --check-readiness

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deploiement
        uses: actions/deploy-pages@v4
