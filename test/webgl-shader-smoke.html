sx += wakeDx * wakeFade;\n          sz += wakeDz * wakeFade;\n          world.y += h;\n          vWorld = world.xyz;\n          vNormalW = normalize(vec3(-sx, 1.0, -sz));\n          vHeight = h;\n          vCurvature = curve;\n          vWake = wake;\n          if (wakeUv.x <= 0.0 || wakeUv.x >= 1.0 || wakeUv.y <= 0.0 || wakeUv.y >= 1.0) vWakeFoam = 0.0;\n          vWakeUv = wakeUv;\n          gl_Position = projectionMatrix * viewMatrix * world;\n        }\n      ","fragment":"\n        precision highp float;\n        uniform float uTime;\n        uniform float uStorm;\n        uniform vec3 uDeep;\n        uniform vec3 uMid;\n        uniform vec3 uShallow;\n        uniform vec3 uFoam;\n        uniform vec3 uSky;\n        uniform vec3 uHaze;\n        uniform vec3 uSunDir;\n        uniform float uDetail;\n        uniform sampler2D uSeaDetail;\n        uniform vec2 uWindDir;\n        uniform int uIslandCount;\n        uniform vec4 uIslands[8];\n        varying vec3 vWorld;\n        varying vec3 vNormalW;\n        varying float vHeight;\n        varying float vCurvature;\n        varying float vWake;\n        varying float vWakeFoam;\n        // Le fragment ne déclarait NI uWakeTex NI vWakeUv : vWakeUv était un\n        // varying mort et la mousse n'arrivait qu'échantillonnée PAR SOMMET,\n        // soit tous les 1,52 m sur l'anneau proche. Une traînée de 1 à 2 m de\n        // large était donc moyennée dans le vide — le sillage ne se voyait pas.\n        uniform sampler2D uWakeTex;\n        varying vec2 vWakeUv;\n\n        float hash21(vec2 p) {\n          p = fract(p * vec2(123.34, 456.21));\n          p += dot(p, p + 45.32);\n          return fract(p.x * p.y);\n        }\n\n        float noise(vec2 p) {\n          vec2 i = floor(p);\n          vec2 f = fract(p);\n          f = f * f * (3.0 - 2.0 * f);\n          return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),\n                     mix(hash21(i + vec2(0.0, 1.0)), hash21(i + 1.0), f.x), f.y);\n        }\n\n        float coastDistance(vec2 p) {\n          float best = 99.0;\n          for (int i = 0; i < 8; i++) {\n            if (i >= uIslandCount) break;\n            vec4 island = uIslands[i];\n            vec2 q = (p - island.xy) / max(island.zw, vec2(0.1));\n            float qLength = max(length(q), 0.001);\n            vec2 gradient = (p - island.xy) / max(island.zw * island.zw, vec2(0.01));\n            float distance = abs(qLength - 1.0) * qLength / max(length(gradient), 0.001);\n            best = min(best, distance);\n          }\n          return best;\n        }\n\n        void main() {\n          vec3 normal = normalize(vNormalW);\n          vec3 viewDir = normalize(cameraPosition - vWorld);\n          float viewDist = length(cameraPosition.xz - vWorld.xz);\n\n          // Long wind-aligned ripples replace the isotropic cellular pattern.\n          // The source texture is periodic; rotating/scaling its coordinates\n          // here preserves that continuity while making crests read as water.\n          vec2 wind = normalize(uWindDir);\n          vec2 crossWind = vec2(-wind.y, wind.x);\n          vec2 windSpace = vec2(dot(vWorld.xz, crossWind), dot(vWorld.xz, wind));\n          float detailFade = 1.0 - smoothstep(38.0, 245.0, viewDist);\n          vec4 coarse = vec4(0.5, 0.5, 1.0, 0.0);\n          vec4 fine = vec4(0.5, 0.5, 1.0, 0.0);\n          float crestMask = 0.0;\n          if (uDetail > 0.5 && detailFade > 0.002) {\n            coarse = texture2D(uSeaDetail, windSpace * vec2(0.026, 0.082) + vec2(0.0, uTime * 0.0065));\n            fine = texture2D(uSeaDetail, windSpace * vec2(0.070, 0.205) + vec2(0.19, -uTime * 0.011));\n            vec2 rippleWind = ((coarse.xy - 0.5) * 0.52 + (fine.xy - 0.5) * 0.26) * vec2(0.58, 1.10);\n            vec2 rippleWorld = crossWind * rippleWind.x + wind * rippleWind.y;\n            normal.xz += rippleWorld * detailFade;\n            normal = normalize(normal);\n            crestMask = max(coarse.a, fine.a);\n          }\n\n          // One very low-frequency sample carries readable swell after the\n          // coarse clipmap geometry has deliberately flattened near the horizon.\n          float swellFade = 1.0 - smoothstep(110.0, 920.0, viewDist);\n          if (uDetail > 0.5 && swellFade > 0.002) {\n            vec4 swell = texture2D(uSeaDetail, windSpace * vec2(0.010, 0.024) + vec2(0.07, uTime * 0.0028));\n            vec2 swellWind = (swell.xy - 0.5) * vec2(0.34, 0.72);\n            normal.xz += (crossWind * swellWind.x + wind * swellWind.y) * swellFade;\n            normal = normalize(normal);\n          }\n\n          float ndv = clamp(dot(normal, viewDir), 0.0, 1.0);\n          float fresnel = 0.025 + 0.975 * pow(1.0 - ndv, 5.0);\n          float sunLight = max(dot(normal, uSunDir), 0.0);\n          float glintDot = max(dot(reflect(-uSunDir, normal), viewDir), 0.0);\n          // Le speculaire est une constellation de petites facettes, pas un\n          // projecteur flou. Le masque de micro-crete casse les grandes zones\n          // ou la normale basse frequence s'aligne d'un bloc avec le soleil.\n          float sparkleMask = 0.24 + crestMask * 0.76;\n          float glitter = pow(glintDot, mix(\n            68.0,\n            160.0,\n            detailFade\n          )) * mix(0.24, 0.82, detailFade) * sparkleMask;\n          float glitterPath = pow(glintDot, mix(\n            28.0,\n            46.0,\n            detailFade\n          )) * (0.42 + crestMask * 0.40);\n\n          float coast = coastDistance(vWorld.xz);\n          float shallow = 1.0 - smoothstep(1.0, 28.0, coast);\n          float coastFoam = (1.0 - smoothstep(0.20, 2.8, coast))\n            * (0.62 + max(coarse.a, fine.a) * 0.46);\n          float cloudShadow = 1.0\n            + (noise(vWorld.xz * 0.007 + vec2(uTime * 0.012, -uTime * 0.008)) - 0.5)\n            * mix(0.16, 0.34, uStorm);\n\n          // Tropical depth first, reflection second. Direct light only nudges\n          // value; using it as atrix * vec4(position, 1.0);\n          vDirection = normalize(world.xyz - cameraPosition);\n          gl_Position = projectionMatrix * viewMatrix * world;\n        }\n      ","fragment":"\n        precision highp float;\n        uniform float uTime;\n        uniform float uStorm;\n        uniform float uLightning;\n        uniform vec3 uSunDir;\n        uniform vec3 uTop;\n        uniform vec3 uHorizon;\n        uniform vec3 uStormColor;\n        uniform sampler2D uClouds;\n        uniform float uHasClouds;\n        varying vec3 vDirection;\n\n        float hash31(vec3 p) {\n          p = fract(p * 0.1031);\n          p += dot(p, p.yzx + 33.33);\n          return fract((p.x + p.y) * p.z);\n        }\n\n        float noise3(vec3 p) {\n          vec3 i = floor(p);\n          vec3 f = fract(p);\n          f = f * f * (3.0 - 2.0 * f);\n          float n000 = hash31(i + vec3(0,0,0));\n          float n100 = hash31(i + vec3(1,0,0));\n          float n010 = hash31(i + vec3(0,1,0));\n          float n110 = hash31(i + vec3(1,1,0));\n          float n001 = hash31(i + vec3(0,0,1));\n          float n101 = hash31(i + vec3(1,0,1));\n          float n011 = hash31(i + vec3(0,1,1));\n          float n111 = hash31(i + vec3(1,1,1));\n          return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),\n                     mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);\n        }\n\n        float fbm(vec3 p) {\n          float value = 0.0;\n          float amplitude = 0.55;\n          for (int i = 0; i < 4; i++) {\n            value += noise3(p) * amplitude;\n            p = p * 2.03 + 13.7;\n            amplitude *= 0.48;\n          }\n          return value;\n        }\n\n        void main() {\n          vec3 dir = normalize(vDirection);\n          float skyMix = smoothstep(-0.04, 0.78, dir.y);\n          // Keep the palette hue, but expose the near-white horizon below the\n          // post-process shoulder so it does not turn into a yellow-white panel.\n          vec3 exposedHorizon = uHorizon * 0.84;\n          vec3 color = mix(exposedHorizon, uTop, skyMix);\n          float horizonVeil = 1.0 - smoothstep(0.015, 0.19, abs(dir.y));\n          color = mix(color, exposedHorizon, horizonVeil * 0.30);\n\n          // A compact solar disc and a restrained warm halo. The former pow(155)\n          // lobe covered several degrees and blew out half of the horizon.\n          float sunDot = max(dot(dir, uSunDir), 0.0);\n          float sunCore = smoothstep(0.99978, 0.99997, sunDot);\n          float sunHalo = pow(sunDot, 180.0);\n          float sunAureole = pow(sunDot, 28.0);\n          color += vec3(1.0, 0.57, 0.20) * sunAureole * 0.025 * (1.0 - uStorm * 0.78);\n          color += vec3(1.0, 0.73, 0.34) * sunHalo * 0.18 * (1.0 - uStorm * 0.82);\n          color += vec3(1.0, 0.92, 0.62) * sunCore * 1.35 * (1.0 - uStorm * 0.88);\n\n          vec3 cloudP = dir * vec3(4.2, 2.0, 4.2);\n          cloudP.xz += vec2(uTime * 0.025, -uTime * 0.018);\n          // Textured cumulus costs two samples; fbm remains only as a missing\n          // asset fallback. Coverage thickens into a real mass during the Grain.\n          float cloud;\n          if (uHasClouds > 0.5) {\n            vec2 cloudUv = vec2(atan(dir.z, dir.x) * 0.15915494 + uTime * 0.0045, clamp(dir.y * 1.28, 0.0, 1.0));\n            // Integer angular repeat keeps atan's +/-pi wrap continuous.\n            vec2 cloudUv2 = vec2(cloudUv.x * 2.0 - uTime * 0.0026, cloudUv.y * 0.86 + 0.06);\n            cloud = max(texture2D(uClouds, cloudUv).r, texture2D(uClouds, cloudUv2).r * 0.72);\n          } else {\n            cloud = fbm(cloudP);\n          }\n          float cloudBand = smoothstep(0.015, 0.17, dir.y) * (1.0 - smoothstep(0.70, 0.94, dir.y));\n          float coverage = mix(0.68, 0.31, uStorm);\n          float density = smoothstep(coverage, coverage + 0.15, cloud) * cloudBand;\n          // Les nuages se chargent de sable au lieu de virer à la nuit.\n          vec3 cloudColor = mix(vec3(1 "name":"particles","vertex":"\n        attribute vec3 aColor;\n        attribute float aSize;\n        attribute float aAlpha;\n        varying vec3 vColor;\n        varying float vAlpha;\n        void main() {\n          vec4 mv = modelViewMatrix * vec4(position, 1.0);\n          gl_PointSize = aSize * (260.0 / max(1.0, -mv.z));\n          vColor = aColor;\n          vAlpha = aAlpha;\n          gl_Position = projectionMatrix * mv;\n        }\n      ","fragment":"\n        varying vec3 vColor;\n        varying float vAlpha;\n        void main() {\n          vec2 p = gl_PointCoord - 0.5;\n          float d = dot(p,p) * 4.0;\n          float alpha = smoothstep(1.0, 0.0, d) * vAlpha;\n          gl_FragColor = vec4(vColor, alpha);\n        }\n      "},{"name":"spell-vfx-atlas","vertex":"\n        attribute vec2 aCorner;\n        attribute float aAge;\n        attribute float aScale;\n        attribute float aEffect;\n        attribute float aRotation;\n        attribute float aFlipX;\n        attribute float aIntensity;\n        uniform vec2 uGrid;\n        varying vec2 vUv;\n        varying float vFade;\n        varying float vIntensity;\n        void main() {\n          vec2 cell = vec2(1.0) / uGrid;\n          float column = mod(aEffect, uGrid.x);\n          float row = floor(aEffect / uGrid.x);\n          vec2 localUv = aCorner * 0.5 + 0.5;\n          if (aFlipX < 0.0) localUv.x = 1.0 - localUv.x;\n          vUv = localUv * cell + vec2(column * cell.x, 1.0 - (row + 1.0) * cell.y);\n          float t = clamp(aAge, 0.0, 1.0);\n          float enter = smoothstep(0.0, 0.10, t);\n          float leave = 1.0 - smoothstep(0.62, 1.0, t);\n          vFade = aAge > 1.0 ? 0.0 : enter * leave;\n          vIntensity = aIntensity;\n          float growth = mix(0.58, 1.18, smoothstep(0.0, 0.78, t));\n          vec4 mv = modelViewMatrix * vec4(position, 1.0);\n          float cosine = cos(aRotation);\n          float sine = sin(aRotation);\n          vec2 orientedCorner = mat2(cosi
